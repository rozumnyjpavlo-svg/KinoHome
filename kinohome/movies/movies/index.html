<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кино Хоум — Онлайн кинотеатр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger fs-3" href="{% url 'home' %}">🎬 Кино Хоум</a>
            <a href="/admin/" class="btn btn-outline-light btn-sm" target="_blank">Панель администратора</a>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Поиск и фильтры -->
        <form method="get" class="row g-3 mb-4">
            <div class="col-md-6">
                <input type="text" name="q" class="form-control bg-secondary text-white border-0" placeholder="Поиск фильма или сериала..." value="{{ request.GET.q|default:'' }}">
            </div>
            <div class="col-md-4">
                <select name="genre" class="form-select bg-secondary text-white border-0">
                    <option value="">Все жанры</option>
                    {% for g in genres %}
                        <option value="{{ g.id }}" {% if request.GET.genre == g.id|stringformat:"s" %}selected{% endif %}>{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-danger w-100">Найти</button>
            </div>
        </form>

        <!-- Список фильмов -->
        <div class="row row-cols-1 row-cols-md-4 g-4">
            {% for movie in movies %}
                <div class="col">
                    <div class="card bg-secondary text-white h-100 border-0 shadow">
                        {% if movie.poster %}
                            <img src="{{ movie.poster.url }}" class="card-img-top" alt="{{ movie.title }}" style="height: 350px; object-fit: cover;">
                        {% elif movie.poster_url %}
                            <img src="{{ movie.poster_url }}" class="card-img-top" alt="{{ movie.title }}" style="height: 350px; object-fit: cover;">
                        {% else %}
                            <div class="card-img-top bg-dark d-flex align-items-center justify-content-center" style="height: 350px;">Нет постера</div>
                        {% endif %}
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ movie.title }}</h5>
                            <p class="card-text text-light small">{{ movie.release_year }} | ⭐ {{ movie.rating }}</p>
                            <a href="{% url 'movie_detail' movie.id %}" class="btn btn-danger mt-auto">Смотреть</a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="col-12 text-center py-5">
                    <h3>Ничего не найдено</h3>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
